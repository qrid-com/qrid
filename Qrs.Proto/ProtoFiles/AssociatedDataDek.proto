syntax = "proto3";
package qridproto;
option csharp_namespace = "Qrs.Proto";

import "google/protobuf/timestamp.proto";
import "Qrs.Proto/ProtoFiles/AssociatedDataItem.proto";

message AssociatedDataDek
{
    string kek_name = 1;
    string app_name = 2;
    int32 top_level_key = 3;
    repeated AssociatedDataItem associated_data_items = 4;
    google.protobuf.Timestamp created = 5;
    string dek_id = 6;
}



