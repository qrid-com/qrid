syntax = "proto3";
package qridproto;
option csharp_namespace = "Qrid.Proto.Envelope1";

import "google/protobuf/timestamp.proto";
import "Qrid.Common.Proto/ProtoFiles/Crypto/SignedBytes.proto";
import "Qrid.Common.Proto/ProtoFiles/Crypto/CertSignedBytes.proto";
import "Qrid.Common.Proto/ProtoFiles/Crypto/SymEncryptedBytes.proto";
import "Qrid.Common.Proto/ProtoFiles/Crypto/AsymEncryptedBytes.proto";

message AccessListItem
{
	string username = 1;
	int32 access_read = 2; 
	int32 access_write = 3;
	int32 access_grant = 4;
	google.protobuf.Timestamp updated = 5;
	string updated_by = 6;
}



