syntax = "proto3";
package qridproto;
option csharp_namespace = "Qrid.Proto.Enclave";

import "google/protobuf/timestamp.proto";
import "Qrid.Common.Proto/ProtoFiles/Crypto/AsymEncryptedBytes.proto";
import "Qrid.Common.Proto/ProtoFiles/Crypto/SymEncryptedBytes.proto";
import "Qrid.Proto/ProtoFiles/Enclave/EnclaveStatus.proto";

message ExistingUserEmailResponse
{
        EnclaveStatus enclave_status = 1;
        AsymEncryptedBytes encrypted_mailer_request = 2;
        SymEncryptedBytes mail_encrypted_user_data = 3;
        string username = 4;
        string hint = 5; // can put QR Code Text in here in DEBUG builds only to simplify local development/debugging (no need to send/check email)
}

