syntax = "proto3";
package qridproto;
option csharp_namespace = "Qrid.Proto.StorageApi";

import "google/protobuf/timestamp.proto";
import "Qrid.Common.Proto/ProtoFiles/DataTypeEnum.proto";

message Blob
{
    int64 id = 1;
    int32 folder_id = 2;
    string name = 3;
    bytes encrypted_data = 4;
    string encrypting_key_id = 5;
    string status = 6;
    string external_id = 7;
    google.protobuf.Timestamp create_date = 8;
    google.protobuf.Timestamp update_date = 9;


}

