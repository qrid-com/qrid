syntax = "proto3";
package qridproto;
option csharp_namespace = "Qrid.Proto.StorageApi";

import "google/protobuf/timestamp.proto";
import "Qrid.Common.Proto/ProtoFiles/DataTypeEnum.proto";

message Folder
{
    int32 id = 1;
    int32 user_id = 2;
    int32 app_id = 3;
    int32 parent_id = 4;
    string name = 5;
    string path = 6;
}

