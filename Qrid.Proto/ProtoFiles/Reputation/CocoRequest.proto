syntax = "proto3";
package qridproto;
option csharp_namespace = "Qrid.Proto.Reputation";

import "google/protobuf/timestamp.proto";
import "Qrid.Proto/ProtoFiles/Reputation/CocoRequestItem.proto";

message CocoRequest
{
    string id = 1;
    repeated CocoRequestItem items = 2;
    string app_name = 3;
    google.protobuf.Timestamp create_date = 4;
}
