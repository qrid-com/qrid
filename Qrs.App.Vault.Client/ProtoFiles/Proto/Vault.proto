syntax = "proto3";
package qridproto;
option csharp_namespace = "Qrs.App.Vault.Client.Proto";

import "google/protobuf/timestamp.proto";
import "Qrs.App.Vault.Client/ProtoFiles/Proto/File.proto";

message Vault
{
    string vault_file_name = 1;
    string vault_type = 2;
    google.protobuf.Timestamp created = 3;
    repeated File files = 8;
}



