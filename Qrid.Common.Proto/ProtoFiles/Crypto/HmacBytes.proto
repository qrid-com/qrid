syntax = "proto3";
package qridproto;
option csharp_namespace = "Qrid.Common.Proto.Crypto";

import "google/protobuf/timestamp.proto";
import "Qrid.Common.Proto/ProtoFiles/Crypto/CryptoHmac.proto";
import "Qrid.Common.Proto/ProtoFiles/Crypto/Enums.proto";

message HmacBytes
{
    bytes bytes = 1;
    CryptoHmac hmac = 2;
}
