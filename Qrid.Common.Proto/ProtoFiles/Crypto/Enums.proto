syntax = "proto3";
package qridproto;
option csharp_namespace = "Qrid.Common.Proto.Crypto";

enum EncryptionAlgo
{
    ENCRYPTION_ALGO_UNSPECIFIED = 0;
    ENCRYPTION_ALGO_AES_GCM_128 = 1;
    ENCRYPTION_ALGO_AES_GCM_256 = 2;
}

enum EncryptionSchema
{
    ENCRYPTION_SCHEMA_UNSPECIFIED = 0;
    ENCRYPTION_SCHEMA_IES_LEGACY = 1;
    ENCRYPTION_SCHEMA_IES_EC_P256_SHA256_AES256CBC_SHA256 = 2;
    ENCRYPTION_SCHEMA_HYBRID_EC_P256_MLKEM768_SHA256_AES256CBC_SHA256 = 3;
}

enum KeyAlgo
{
    KEY_ALGO_UNSPECIFIED = 0;
    KEY_ALGO_ECDSA = 1;
    KEY_ALGO_AES = 2;
    KEY_ALGO_SHA256 = 3;
    KEY_ALGO_ML_KEM = 4;
    KEY_ALGO_HYBRID_EC_ML_KEM = 5;
}

enum KeyType
{
    KEY_TYPE_UNSPECIFIED = 0;
    KEY_TYPE_SECRET = 1;
    KEY_TYPE_PRIVATE = 2;
    KEY_TYPE_PUBLIC = 3;
}

enum KeyUsage
{
    KEY_USAGE_UNSPECIFIED = 0;
    KEY_USAGE_ENCRYPT = 1;
    KEY_USAGE_DECRYPT = 2;
    KEY_USAGE_SIGN = 3;
    KEY_USAGE_VERIFY = 4;
    KEY_USAGE_DERIVE_KEY = 5;
    KEY_USAGE_DERIVE_BITS = 6;
    KEY_USAGE_WRAP_KEY = 7;
    KEY_USAGE_UNWRAP_KEY = 8;
}

enum HashAlgo
{
    HASH_ALGO_UNSPECIFIED = 0;
    HASH_ALGO_SHA2_X256 = 210;
    HASH_ALGO_SHA2_X512 = 220;
    HASH_ALGO_SHA3_X256 = 310;
    HASH_ALGO_SHA3_X512 = 320;
}

enum SigType
{
    SIG_TYPE_UNSPECIFIED = 0;
    SIG_TYPE_EC_DSA = 1;
    SIG_TYPE_ML_DSA = 2;
    SIG_TYPE_HYBRID_EC_DSA_ML_DSA = 3;
}

enum EccCurve
{
    ECC_CURVE_UNSPECIFIED = 0;
    ECC_CURVE_SECP256R1 = 1;
    ECC_CURVE_SECP384R1 = 2;
}

enum KdfType
{
    KDF_TYPE_UNSPECIFIED = 0;
    KDF_TYPE_PBKDF2 = 1;
    KDF_TYPE_BCRYPT = 2;
    KDF_TYPE_SCRYPT = 3;
    KDF_TYPE_ARGON2I = 4;
    KDF_TYPE_ARGON2D = 5;
    KDF_TYPE_ARGON2ID = 6;
}
