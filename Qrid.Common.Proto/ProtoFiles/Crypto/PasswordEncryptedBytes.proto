syntax = "proto3";
package qridproto;
option csharp_namespace = "Qrid.Common.Proto.Crypto";

import "google/protobuf/timestamp.proto";
import "Qrid.Common.Proto/ProtoFiles/Crypto/SymEncryptedBytes.proto";
import "Qrid.Common.Proto/ProtoFiles/Crypto/Enums.proto";
import "Qrid.Common.Proto/ProtoFiles/Crypto/KdfParams.proto";

message PasswordEncryptedBytes
{
    //KdfType kdf_type = 1; commenting out b/c kdf_type is now in KdfParams
    KdfParams kdf_params = 5; // changed to 5 from 2 b/c 2 was a "string" and 5 is now "KdfParams"
    string salt = 3;
    SymEncryptedBytes bytes = 4;
    
}
