syntax = "proto3";
package qridproto;
option csharp_namespace = "Qrid.Common.Proto.Crypto";

import "google/protobuf/timestamp.proto";
import "Qrid.Common.Proto/ProtoFiles/Crypto/HashSig.proto";

message CertifiedSig
{
    HashSig hash_sig = 1; 
    Certificate sig_certificate = 2;
}

message Certificate
{
    bytes certificate_data = 1;
    CertifiedSig certifying_sig = 2;
}