syntax = "proto3";
package qridproto;
option csharp_namespace = "Qrid.Common.Proto.CanonicalCrypto";

import "google/protobuf/timestamp.proto";
import "Qrid.Common.Proto/ProtoFiles/Crypto/Enums.proto";

message MlKemPrivateKey
{

    // ML KEM Private Key contains the following elements:
    // - "s" - secret key used at decryption/decapsulation (secret polynomial vector)
    // - "hpk" - SHA3x256 Hash of the Public key
    // - "nonce" - aka "e"(?) - error vector (?)
    // - "pk" = "t || rho" - public key, needs to be here to protect from CCA (Choosen Cipher Attack). "rho" is also known as "p". See MlPublicKey comments
    // - "seed" - aka "z"(?) - random ""fallback"" secret - to prevent some side channel/timing attack?

    // but we would just store it all here as bytes b/c there seems to be established standard encoding/decoding to/from bytes, 
    // and so far it looks like we do NOT need to deal with individual pieces, at least not in this c# implementation using Bouncy Castle

    bytes PrivateBytes = 1;   // encoded into bytes using Bouncy Castle API 
     
}
