syntax = "proto3";
package qridproto;
option csharp_namespace = "Qrs.App.PasswordManager.Client.Proto";

import "google/protobuf/timestamp.proto";

message ExportedResource
{
    string qrs_file_name = 1;

    string resource_id = 2;
    string resource_type = 3;
    string resource_name = 4;
    string username = 5;
    string resource_notes = 6;

    string secret_password = 7;
    string secret_notes = 8;
    bytes  secret_file_content = 9;
    string secret_padding = 10;
    
    string file_path = 11;
    google.protobuf.Timestamp created = 12;
    
}



